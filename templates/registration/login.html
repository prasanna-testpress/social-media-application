{% extends "base.html" %}

{% block title %}Log-in{% endblock %}

{% block content %}
<h1>Log-in</h1>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<form action="." method="post">
    {{ form.as_p }}
    {% csrf_token %}
    <p><input type="submit" value="Log in"></p>
</form>

<div class="social">
  <ul>
    <li class="facebook">
      <a href="{% url 'social:begin' 'facebook' %}">Sign in with Facebook</a>
    </li>
  </ul>
</div>
{% endblock %}
